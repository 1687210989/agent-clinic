name: CI

# 为什么要有它：自检此前没有任何自动化执行者 —— 靠人手跑，
# 于是出现过"徽章是绿的、实跑是红的"（断言依赖宿主并发写入的状态）。
#
# 第三方评估（实测版）§3.1 的直接教训：CI 曾经**连续两次全红**，根因是
# smoke 步骤既没设 DSH_HOME、也没造语料 —— runner 上不存在 ~/.dsh/sessions，
# 于是"会话根目录存在"这类断言直接计为失败，退出码 1，
# 后续步骤从未执行到。也就是说：**当时所有提交都未经自动化验证**。
#
# 现在的纪律：
#   1. smoke 必须在**合成语料**上跑（每指标至少命中 1 处），并设
#      DSH_SMOKE_REQUIRE_DATA=1 —— 这样"因为没数据而跳过"会立刻变红，
#      降级不得冒充全绿；
#   2. 另跑一次**空数据降级**，要求退出码 0（降级是真的，不是崩）；
#   3. README 徽章数字由 smoke 自己在跑完后核对（评估 §3.2 的整改护栏），
#      不一致即失败 —— 此处不另设步骤，避免"两个地方各说各话"。
#   4. runner 标签**显式写版本**，不用会自己漂移的 ubuntu-latest（见下）。
#
# runner 标签（2026-10-15 决定，依据 actions/runner-images#14748）：
#   `ubuntu-latest` 从 2026-10-19 起分几周灰度切到 **Ubuntu 26.04**，11-19 完成。
#   官方给的缓解办法就是显式写标签（`ubuntu-24.04` 留旧 / `ubuntu-26.04` 提前试）。
#   于是这里：
#     · 主矩阵钉 `ubuntu-24.04` —— 确定、可复核，不受灰度窗口影响；
#     · 同时挂一条 `ubuntu-26.04` **探针**（只配 node 24，控成本）——
#       提前几周知道新镜像会不会踩到我们，而不是等 11-19 被动变红。
#   差异主要在 OS 24.04.5 → 26.04.1、内核 6.17 → 7.0、systemd 255 → 259。
#   smoke 的「基建」段守着"三平台覆盖 + Linux 显式版本 + 不得回退到 ubuntu-latest"。
#
# 两个 action 用 v7（v4 跑在 Node 20 上，已被 GitHub 强制迁到 Node 24 并持续告警；
# v7 是 ESM 迁移版，本项目只用默认参数，无破坏性影响）。
#
# 2026-10-15 第二次加固（起因：连续两次 run 红，但**不是代码失败**）：
#   现象：两个 `macos-latest` job 的 `steps: 0`、`runner` 为空、
#         `started_at == created_at`，排队 **15 分钟后被 cancelled**，
#         其余 6 个 job 16 步全绿（7~33 秒）。也就是说 macOS job **一行代码都没跑**。
#   原因：GitHub 托管 macOS runner 的容量/额度（macOS 计费是 Linux 的 **10 倍**，
#         而当天触发了 22 次 workflow ≈ 44 个 macOS job）。
#   于是这一轮加三件事（都不是削弱门槛，而是把资源用在刀刃上）：
#     ① `concurrency` —— 同 ref 的新推送取消旧 run，避免"连推 4 次 = 排 8 个 macOS job"；
#     ② **矩阵分档**：push 用轻量矩阵（macOS 只跑 node 24），
#        tag / 手动触发用全量矩阵（macOS 两个 node 版本）—— 发行提交才需要跑满；
#     ③ 每个 job 加 `timeout-minutes` —— 拿不到 runner 时**快速失败并写明原因**，
#        而不是静默排队 15 分钟被取消（那种红在 UI 上看不出原因）。

on:
  push:
    branches: [main]
    # ⚠️ 必须显式列出 tags —— 否则**推 tag 不会触发本 workflow**（`branches` 会把 tag 排除），
    #    plan 里"tag → 全量矩阵"那条分支就永远走不到（这是我加完矩阵分档后自查发现的坑）。
    #    发行提交值得跑满：tag 推送走全量矩阵。
    tags: ['v*']
  pull_request:
  # 手动触发 = 全量矩阵（需要在某个提交上跑满三平台两个 node 版本时用）
  workflow_dispatch:

# 同一个 ref 上的新 run 取代旧 run：省 runner、也避免"旧 run 还在排队"的噪音。
# 用 ref 分组，所以 tag 与 main 互不取消（发行 run 不会被普通推送打断）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先算矩阵：push 轻量 / tag·手动 全量。写成 job 而不是在 matrix 里做条件，
  # 是因为 GitHub 的 `matrix` 上下文在 `jobs.<id>.if` 里不可用。
  plan:
    name: 计划矩阵（push 轻量 / tag·手动 全量）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      scope: ${{ steps.pick.outputs.scope }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          # 全量：4 个 runner 标签 × 2 个 node（Ubuntu 26.04 只留 node 24 —— 它是迁移探针）
          full='{"include":[
          {"os":"ubuntu-24.04","node":"22.15.0"},
          {"os":"ubuntu-24.04","node":"24"},
          {"os":"ubuntu-26.04","node":"24"},
          {"os":"macos-latest","node":"22.15.0"},
          {"os":"macos-latest","node":"24"},
          {"os":"windows-latest","node":"22.15.0"},
          {"os":"windows-latest","node":"24"}]}'
          # 轻量（push）：macOS 只跑 node 24 —— macOS 额度是 Linux 的 10 倍，
          # 且实测会出现"排队 15 分钟拿不到 runner 被取消"。
          light='{"include":[
          {"os":"ubuntu-24.04","node":"22.15.0"},
          {"os":"ubuntu-24.04","node":"24"},
          {"os":"ubuntu-26.04","node":"24"},
          {"os":"macos-latest","node":"24"},
          {"os":"windows-latest","node":"22.15.0"},
          {"os":"windows-latest","node":"24"}]}'
          if [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            # ⚠️ 多行值必须用 heredoc 语法写进 GITHUB_OUTPUT —— 用 `printf 'matrix=%s'`
            #    只会写进第一行，`fromJSON` 于是拿到半个 JSON 直接失败（这里踩过一次）。
            {
              echo "matrix<<MATRIX_EOF"
              echo "$full"
              echo "MATRIX_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "scope=light" >> "$GITHUB_OUTPUT"
            {
              echo "matrix<<MATRIX_EOF"
              echo "$light"
              echo "MATRIX_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "本次矩阵档位：${{ github.ref }} / ${{ github.event_name }}"

  smoke:
    name: smoke (${{ matrix.os }} · node ${{ matrix.node }})
    needs: plan
    runs-on: ${{ matrix.os }}
    # 拿不到 runner 时快速失败并写明原因，而不是静默排队 15 分钟被取消
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 环境信息
        run: node -v && npm -v

      # 合成语料：干净 runner 上没有 DSH 会话，所有依赖数据的断言都需要它。
      # 生成器自带"每指标至少命中 1 处"的自校验，覆盖不足会直接失败。
      - name: 生成合成会话语料
        run: node scripts/fixtures/synth-dsh.mjs --out ${{ runner.temp }}/dsh-home

      - name: 语料覆盖率自检（每个指标都要被触达）
        run: node scripts/fixtures/synth-dsh.mjs --verify

      - name: 自检（合成数据 · 跳过数必须为 0）
        run: node scripts/smoke.mjs
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          DSH_SMOKE_REQUIRE_DATA: '1'
          # A2（skill 闲置）的一半输入是"本机装了哪些 skill" —— 不给定就只能靠 runner
          # 上恰好装了什么，等于把断言绑在宿主机上（第三方评估 §4.2 那类病）。
          # 语料自带一个必然闲置的 demo skill，这里显式指向它。
          AGENT_CLINIC_SKILL_DIRS: ${{ runner.temp }}/dsh-home/agents-skills
          # A1（MCP 闲置）是**配置驱动**指标：干净 runner 上没有 profile 目录，
          # 同样指向语料自带的 patch（里面配了两个 MCP 服务器且窗口内 0 调用）。
          AGENT_CLINIC_PROFILE_PATCH: ${{ runner.temp }}/dsh-home/cordis.patch.yml

      # 降级必须是"优雅降级"而不是"崩"：无数据时只做能做的检查，
      # 如实列出未验证的维度，并以退出码 0 结束。
      - name: 自检（空数据降级 · 退出码应为 0）
        run: node scripts/smoke.mjs
        env:
          DSH_HOME: ${{ runner.temp }}/agent-clinic-empty-home

      # 报告也要能在干净环境里跑出来（无会话数据时优雅降级，而不是崩）
      - name: 空数据下跑一次报告
        run: node src/cli.mjs report
        env:
          DSH_HOME: ${{ runner.temp }}/agent-clinic-empty-home

      - name: 目录命令自检（不联网）
        run: node src/cli.mjs catalog

      # 指纹快照（决策 D4）：K1/K2 的数据基础。这里验证两件事：
      #   ① fingerprints 子命令在没有任何快照时也能读（不崩、如实说"还没写过"）；
      #   ② 指向临时目录时不许碰 runner 的 ~/.agent-clinic。
      - name: 指纹快照命令自检（临时 HOME，不碰真实状态）
        run: node src/cli.mjs fingerprints
        env:
          HOME: ${{ runner.temp }}/agent-clinic-fp-home
          USERPROFILE: ${{ runner.temp }}/agent-clinic-fp-home

      # 插件面板（浏览器端）的零依赖 DOM 桩测试 —— 决策 D9。
      # 它不依赖 DSH_HOME：自带桩环境，测的是 client.js 的渲染与交互路径。
      - name: 插件面板 DOM 桩测试
        run: node scripts/plugin-dom.test.mjs

      # 发布通道自检（零依赖打包器）：本机没有 npm CLI，发布要自己打包。
      # 这里跑的是**预演**（默认不联网）：打包 → 解包回来逐字节比对 → 打印将要发送的请求。
      # 放在 CI 的意义：tar 头的路径拆分/八进制字段是平台相关的，三平台都过一遍才敢用来发版。
      - name: 发布打包器自检（预演，不联网）
        run: node scripts/publish-npm.mjs

  # 只读与隐私承诺的机器检查：仓库里不该出现会话数据或本地路径
  privacy:
    name: 隐私与仓库卫生
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 生成物不得入库
        run: |
          set -e
          bad=0
          for f in agent-clinic-report.md .agent-clinic .tmp; do
            if [ -e "$f" ]; then echo "::error::$f 不应存在于仓库"; bad=1; fi
          done
          if git ls-files | grep -E '\.(jsonl|zstd)$'; then
            echo "::error::仓库里出现会话数据文件"; bad=1
          fi
          if git ls-files | grep -E '(^|/)(COMMIT_MSG|readme-msg|.*-msg)\.txt$'; then
            echo "::error::提交消息临时文件被入库"; bad=1
          fi
          exit $bad
